{% extends "base.html" %}

{% block title %}
  Edit Company
{% endblock %}

{% block content %}
  <h1>
    Edit Engagement: {{ engagement.id }}
    <button type="submit" form="edit-form">Save</button>
    <a href="{% url 'engagement' item.id %}">
      <button type="button">Cancel</button>
    </a>
  </h1>
  <form id="edit-form" method="post" action="{% url 'engagement' item.id %}">
    {% csrf_token %}
    {{ form.as_p }}
  </form>

{% endblock %}
