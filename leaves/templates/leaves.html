{% extends "_list.html" %}

{% block extra_content %}
<h2>Add a Leave</h2>
<form method="post" action="{% url 'leave-create' %}">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Add Leave</button>
</form>

<h2>Calendar — {{ month }}/{{ year }}</h2>
<form method="get" action="{% url 'leave-list' %}" class="filter-row">
  <div class="filter-col">
    <label for="id_month">Month:</label>
    <input type="number" id="id_month" name="month" value="{{ month }}" min="1" max="12">
  </div>
  <div class="filter-col">
    <label for="id_year">Year:</label>
    <input type="number" id="id_year" name="year" value="{{ year }}" min="1970" max="9999">
  </div>
  <div class="filter-col">
    <label>&nbsp;</label>
    <button type="submit">Go</button>
  </div>
</form>

<div class="calendar">
  {{ calendar }}
</div>

<p>Back to <a href="{% url 'main' %}">Home</a></p>
{% endblock %}
