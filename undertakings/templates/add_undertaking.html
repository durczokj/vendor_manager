{% extends "base.html" %}

{% block title %}
  Add Undertaking
{% endblock %}

{% block content %}
  <h1>
    Add Undertaking
    <button type="submit" form="add-form">Save</button>
    <a href="{% url 'undertakings' %}">
      <button type="button">Cancel</button>
    </a>
  </h1>
  <form id="add-form" method="post" action="{% url 'undertakings' %}">
    {% csrf_token %}
    {{ form.as_p }}
  </form>
{% endblock %}
