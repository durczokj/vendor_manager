<!DOCTYPE html>
<html>

<head>
  <title>{% block title %}{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="{% static 'styles.css' %}">
  <link rel="stylesheet" type="text/css" href="{% static 'table_styles.css' %}">
</head>
<body>

<div class="header">
  <h1><a href="{% url 'main' %}">Vendor Manager</a></h1>
</div>

<div class="container">
  <div class="sidebar">
    <form action="{% url 'logout' %}" method="post">
      {% csrf_token %}
      <button type="submit">Log Out</button>
    </form>

    <h3><a href="{% url 'person-list' %}">People</a></h3>
    <h3><a href="{% url 'company-list' %}">Companies</a></h3>
    <h3><a href="{% url 'undertaking-list' %}">Undertakings</a></h3>
    <h3><a href="{% url 'engagement-list' %}">Engagements</a></h3>
    <h3><a href="{% url 'leave-list' %}">Leaves</a></h3>
    <h3><a href="{% url 'contract-list' %}">Contracts</a></h3>
    <h3><a href="{% url 'order-list' %}">Orders</a></h3>
  </div>

  <div class="content">
    {% block content %}
    {% endblock %}
  </div>
</div>

<div class="messages">
  {% if messages %}
    <ul>
      {% for message in messages %}
        <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</div>

</body>
</html>
