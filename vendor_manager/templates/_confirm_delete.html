{% extends "base.html" %}

{% block title %}Delete {{ object }}?{% endblock %}

{% block content %}
<h1>Delete {{ object }}?</h1>
<form method="post">
  {% csrf_token %}
  <button type="submit">Yes</button>
  {% if back_url %}
    <a href="{{ back_url }}">Cancel</a>
  {% endif %}
</form>
{% endblock %}
