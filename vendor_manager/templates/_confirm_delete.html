{% extends "base.html" %}

{% block title %}Delete {{ object }}{% endblock %}

{% block content %}
<h1>Delete {{ object }}</h1>
<p>Are you sure you want to delete <strong>{{ object }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, delete</button>
  {% if back_url %}
    <a href="{{ back_url }}"><button type="button">Cancel</button></a>
  {% endif %}
</form>
{% endblock %}
