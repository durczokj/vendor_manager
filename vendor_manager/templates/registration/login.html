{% extends "master.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h2>Log In</h2>

{% if form.non_field_errors %}
<ul class="errorlist">
  {% for error in form.non_field_errors %}
    <li>{{ error }}</li>
  {% endfor %}
</ul>
{% endif %}

<form method="post" action="{% url 'login' %}">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Login</button>
</form>
{% endblock %}
