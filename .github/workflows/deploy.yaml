name: Build and Deploy

# Routing:
#   release (prerelease=true)  -> deploy to dev
#   release (prerelease=false) -> deploy to prod
#   workflow_dispatch          -> deploy to the chosen namespace (default: dev)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build and deploy (e.g. 0.0.1)"
        required: true
        type: string
      namespace:
        description: "Target namespace"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag and namespace
        id: vars
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              NS="dev"
            else
              NS="prod"
            fi
          else
            TAG="${{ inputs.tag }}"
            NS="${{ inputs.namespace }}"
          fi
          if [ -z "${TAG}" ]; then
            echo "No tag resolved" >&2
            exit 1
          fi
          echo "tag=${TAG}"       >> "$GITHUB_OUTPUT"
          echo "namespace=${NS}"  >> "$GITHUB_OUTPUT"
          echo "Using tag=${TAG} namespace=${NS}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            durczokj/vendor-manager:${{ steps.vars.outputs.tag }}

      - name: Deploy to k3s
        uses: durczokj/vm/.github/actions/deploy-to-k3s@main
        with:
          app_name: vendor-manager
          deployment_name: vendor-manager
          namespace:      ${{ steps.vars.outputs.namespace }}
          image_tag:      ${{ steps.vars.outputs.tag }}
          server_host:    ${{ secrets.SERVER_HOST }}
          server_user:    ${{ secrets.SERVER_USER }}
          server_ssh_key: ${{ secrets.SERVER_SSH_KEY }}
