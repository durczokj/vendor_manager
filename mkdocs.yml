site_name: Vendor Manager
site_description: >-
  Vendor Manager — track vendors, contracts, orders, people, engagements,
  undertakings and leaves through a clean Django UI and REST API.
docs_dir: docs

strict: true
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Home: index.md
  - User Guide:
      - Getting started: user-guide/getting-started.md
  - Developer Guide:
      - Architecture: developer-guide/architecture.md
      - Data model: ERD.md
      - Roles & permissions: developer-guide/roles-and-permissions.md
      - Local dev: developer-guide/local-dev.md
      - Deployment: developer-guide/deployment.md
      - Requirements: REQUIREMENTS.md
  - API Reference: /docs/api/
