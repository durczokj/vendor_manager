[project]
name = "vendor-manager"
version = "0.0.0"
description = "Vendor Manager — Django application for tracking companies, contracts, engagements, and undertakings."
requires-python = ">=3.13"
readme = "README.md"

# Runtime deps are declared in requirements.txt (pinned) for the Docker build.
# Dev deps are declared in requirements-dev.txt.
# This section exists so the project is a valid PEP 621 package for tooling.
dependencies = []

# ---------------------------------------------------------------------------
# Ruff — lint + format. Replaces black + isort + flake8.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [
    "**/migrations/**",
    "staticfiles/**",
    "notebooks/**",
    # Whole-file rewrite target in Phase 5 (dashboard rework). Not worth
    # cleaning up legacy lint here.
    "dashboards/summary_dashboard.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
# Rule sets:
#   E, W    — pycodestyle
#   F       — pyflakes
#   I       — isort
#   UP      — pyupgrade
#   B       — flake8-bugbear
#   SIM     — flake8-simplify
#   DJ      — flake8-django
#   PT      — flake8-pytest-style
#   D       — pydocstyle (preserves current flake8-docstrings coverage)
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DJ", "PT", "D"]
# The historical .flake8 ignored A003; we're not enabling flake8-builtins (A),
# so A003 is not applicable. Keep the ignore list intentionally short.
ignore = [
    "D100", # missing module docstring — noisy for Django apps.py, urls.py, etc.
    "D104", # missing docstring in public package — same rationale.
    "D203", # 1 blank line before class docstring — conflicts with D211.
    "D213", # multi-line summary second line — conflicts with D212.
]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["D"]
"**/tests/**" = ["D"]
"conftest.py" = ["D"]
"manage.py" = ["D"]
"vendor_manager/settings.py" = ["E501"]

# The following legacy patterns are left in place through P0 and get rewritten
# in later phases. Each ignore lists the rule and the phase that removes it.

# Phase 1 rewrites models: adds __str__, fixes null=True on string fields,
# reorders body, adds docstrings. B008 covers date.today() defaults on Django
# model fields — a Django-idiomatic pattern the rule doesn't understand.
"**/models.py" = ["B008", "D101", "D102", "DJ001", "DJ008", "DJ012"]

# Phase 4 rewrites forms: replaces __all__ with an explicit fields list and
# consolidates docstrings.
"**/forms.py" = ["D101", "DJ007"]

# Django scaffolding files inherited from `startapp` — untouched by later
# phases; a single-line docstring rule doesn't add value here.
"**/apps.py" = ["D100", "D101"]
"**/admin.py" = ["D100", "D101"]
"**/permissions.py" = ["D100", "D103"]
"**/urls.py" = ["D100"]

# BaseListView/BaseDetailView disappear in Phase 3 (viewsets) + Phase 4
# (CBV consolidation). Not worth annotating in P0.
"vendor_manager/views.py" = ["D101", "D102", "D107"]

# Legacy date=date.today() form defaults; addressed by Phase 4 form rewrite.
"**/leaves/forms.py" = ["B008", "D101", "DJ007"]
"**/engagements/forms.py" = ["B008", "D101", "DJ007"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = [
    "vendor_manager",
    "companies",
    "contracts",
    "dashboards",
    "engagements",
    "leaves",
    "orders",
    "people",
    "undertakings",
]

# ---------------------------------------------------------------------------
# mypy — strict typing. Scope escalates per phase (P0.T4 → P8).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
# Only surface errors from the `files` list; transitively-imported modules are
# still analyzed but their errors are suppressed until Phase 8 expands the
# scope to the whole codebase.
follow_imports = "silent"
# Excluded paths are never analyzed — even when imported from a P0-scope module.
exclude = [
    "^.*/migrations/.*",
    "^staticfiles/.*",
    "^notebooks/.*",
    "^manage\\.py$",
    # Going away in P5; annotating it is wasted work.
    "^dashboards/summary_dashboard\\.py$",
    # Tests get their own, looser regime — see the override below and P7/P8.
    "^.*/tests\\.py$",
    "^.*/tests/.*",
]

# P0 scope: only files substantially rewritten or created in P0 are strict-
# checked in CI. Legacy modules (views.py, utils/*, apps' models/forms/views)
# are annotated in P7/P8 as part of the strict-typing sweep. Any new code
# landing must still pass mypy --strict.
files = [
    "vendor_manager/settings.py",
    "vendor_manager/logging.py",
    "vendor_manager/navigation.py",
    "vendor_manager/wsgi.py",
    "vendor_manager/asgi.py",
    "vendor_manager/tests.py",
    "companies/managers.py",
    "contracts/managers.py",
    "people/managers.py",
    "orders/managers.py",
    "undertakings/managers.py",
    "engagements/managers.py",
    "leaves/managers.py",
    # P3.T2: per-app serializers, filters, and viewsets
    "api/serializers.py",
    "api/viewsets.py",
    "companies/serializers.py",
    "companies/filters.py",
    "companies/api.py",
    "contracts/serializers.py",
    "contracts/filters.py",
    "contracts/api.py",
    "people/serializers.py",
    "people/filters.py",
    "people/api.py",
    "orders/serializers.py",
    "orders/filters.py",
    "orders/api.py",
    "undertakings/serializers.py",
    "undertakings/filters.py",
    "undertakings/api.py",
    "engagements/serializers.py",
    "engagements/filters.py",
    "engagements/api.py",
    "leaves/serializers.py",
    "leaves/filters.py",
    "leaves/api.py",
    # P3.T5: auth glue and health
    "vendor_manager/api_permissions.py",
    # P5.T1: dashboard selectors and services
    "dashboards/selectors.py",
    "dashboards/services.py",
]

[[tool.mypy.overrides]]
# tests are covered under a less-strict regime; annotate as we go in P7/P8.
module = ["*.tests", "*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# Third-party libraries without stubs. Add as needed; keep the list explicit.
module = [
    "rolepermissions.*",
    "django_plotly_dash.*",
    "dash.*",
    "whitenoise.*",
    "crispy_forms.*",
    "django_tables2.*",
    "factory.*",
    "pythonjsonlogger.*",
    "django_filters",
    "django_filters.*",
    "rest_framework_nested.*",
    # pandas-stubs not installed; numpy ships its own stubs but mypy still
    # complains on some builds. Suppress until P8 strict-typing sweep.
    "pandas",
    "pandas.*",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "vendor_manager.settings"

# ---------------------------------------------------------------------------
# pytest + pytest-django
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "vendor_manager.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    # Third-party deprecations we don't own — narrow as they come up.
    "ignore::DeprecationWarning:django_plotly_dash.*",
    # drf-nested-routers re-registers the DRF format-suffix URL converter when
    # both the flat router and the nested router include their URL sets.
    # Harmless double-registration; remove once drf-nested-routers upgrades.
    "ignore::django.utils.deprecation.RemovedInDjango60Warning:rest_framework.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = [
    "vendor_manager",
    "companies",
    "contracts",
    "dashboards",
    "engagements",
    "leaves",
    "orders",
    "people",
    "undertakings",
]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/tests/*",
    "manage.py",
    "*/wsgi.py",
    "*/asgi.py",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
# Coverage threshold is 0 in Phase 0 (only smoke tests exist). Phase 7 lands
# per-app tests and raises this to 80 to match NFR-33.
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
